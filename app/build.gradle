plugins { id 'com.android.application' }
android {
 namespace 'com.aly.sahlsync'
 compileSdk 36
 defaultConfig {
  applicationId 'com.aly.sahlsync'
  minSdk 26
  targetSdk 36
  versionCode 29
  versionName '0.9.0-beta.1'
  def clientId = providers.gradleProperty('msalClientId').getOrElse('00000000-0000-0000-0000-000000000000')
  def signature = providers.gradleProperty('msalSignature').getOrElse('UNCONFIGURED')
  buildConfigField 'String', 'MSAL_CLIENT_ID', '"' + clientId + '"'
  buildConfigField 'String', 'MSAL_SIGNATURE', '"' + signature + '"'
  manifestPlaceholders = [msalSignature: signature]
 }
 buildTypes {
  debug { applicationIdSuffix '.preview' }
 }
 buildFeatures { buildConfig true }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 lint { abortOnError true; disable 'HardcodedText', 'SetTextI18n', 'UnusedResources' }
}
dependencies {
 implementation 'com.microsoft.identity.client:msal:8.6.0'
 implementation 'androidx.work:work-runtime:2.10.1'
 implementation 'androidx.documentfile:documentfile:1.1.0'
 implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
 testImplementation 'junit:junit:4.13.2'
}
