name: PC app

on:
  pull_request:
    paths: [desktop/**, .github/workflows/pc.yml]
  push:
    branches: [main]
    paths: [desktop/**, .github/workflows/pc.yml]
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        type: string
        default: ''

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test and build SahlSyncPC.exe
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pyinstaller cryptography "qrcode[pil]"
          Push-Location desktop
          python test_sahl_sync_lan.py
          Pop-Location
          pyinstaller --noconfirm --onefile --windowed --name SahlSyncPC --paths desktop `
            --hidden-import sahl_sync_lan --collect-submodules qrcode desktop/sahl_sync_pc.py
          Get-Item dist/SahlSyncPC.exe
      - uses: actions/upload-artifact@v4
        with:
          name: SahlSyncPC
          path: dist/SahlSyncPC.exe
      - name: Attach to release
        if: inputs.release != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v${{ inputs.release }}" dist/SahlSyncPC.exe --clobber
